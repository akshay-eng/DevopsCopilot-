apiVersion: v1
kind: Service
metadata:
  name: devops-copilot-agent
  namespace: devops-copilot
  labels:
    app: devops-copilot-agent
spec:
  type: ClusterIP
  selector:
    app: devops-copilot-agent
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  sessionAffinity: None
