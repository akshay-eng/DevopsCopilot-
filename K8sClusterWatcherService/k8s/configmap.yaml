apiVersion: v1
kind: ConfigMap
metadata:
  name: devops-copilot-agent-config
  namespace: devops-copilot
  labels:
    app: devops-copilot-agent
data:
  CLUSTER_NAME: "my-cluster"
  CLUSTER_TYPE: "kubernetes"
  K8S_IN_CLUSTER: "true"
  K8S_NAMESPACE: "devops-copilot"

  # Backend Configuration
  BACKEND_URL: "https://api.devopscopilot.com"

  # Prometheus Configuration
  PROMETHEUS_URL: "http://prometheus:9090"
  PROMETHEUS_SCRAPE_INTERVAL: "30"

  # Grafana Configuration
  GRAFANA_URL: "http://grafana:3000"

  # Loki Configuration
  LOKI_URL: "http://loki:3100"

  # Kafka Configuration
  KAFKA_BOOTSTRAP_SERVERS: "kafka.devopscopilot.com:9092"
  KAFKA_SECURITY_PROTOCOL: "SASL_SSL"
  KAFKA_SASL_MECHANISM: "PLAIN"

  # Kafka Topics
  KAFKA_TOPIC_ALERTS: "alerts"
  KAFKA_TOPIC_METRICS: "metrics"
  KAFKA_TOPIC_EVENTS: "k8s-events"
  KAFKA_TOPIC_LOGS: "logs"
  KAFKA_TOPIC_RESOURCES: "resources"

  # API Server
  API_SERVER_HOST: "0.0.0.0"
  API_SERVER_PORT: "8080"

  # Health Check
  HEALTH_CHECK_INTERVAL: "60"
  HEARTBEAT_INTERVAL: "30"

  # Feature Flags
  ENABLE_METRICS_COLLECTION: "true"
  ENABLE_LOG_COLLECTION: "true"
  ENABLE_EVENT_WATCHING: "true"
  ENABLE_RESOURCE_WATCHING: "true"
  ENABLE_ALERT_WATCHING: "true"

  # Resource Watching
  WATCH_RESOURCES: "pods,services,deployments,nodes,namespaces,ingresses"

  # Retry Configuration
  MAX_RETRIES: "3"
  RETRY_BACKOFF: "5"

  # Logging
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"

  # Sentry
  SENTRY_ENVIRONMENT: "production"
