version: '3.8'

services:
  backend:
    build: .
    container_name: devops-copilot-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/devops-copilot
      - KAFKA_BROKERS=broker:9092
      - JWT_SECRET=your-jwt-secret-change-this
      - FRONTEND_URL=http://localhost:3000
      - ENABLE_WEBSOCKET=true
      - ENABLE_KAFKA_CONSUMER=true
    depends_on:
      - mongo
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs
    networks:
      - devops-copilot
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: devops-copilot-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - devops-copilot
    restart: unless-stopped

networks:
  devops-copilot:
    driver: bridge

volumes:
  mongo_data:
