apiVersion: v1
kind: Service
metadata:
  name: alert-webhook-service
  namespace: alerts
  labels:
    app: alert-webhook-service
    component: alerting
spec:
  type: ClusterIP
  selector:
    app: alert-webhook-service
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  sessionAffinity: None
