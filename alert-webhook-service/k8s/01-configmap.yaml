apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-webhook-config
  namespace: alerts
  labels:
    app: alert-webhook-service
    component: alerting
data:
  # MongoDB Configuration (internal K8s service DNS)
  MONGO_URI: "mongodb://adminuser:password123@mongo-nodeport-svc.default.svc.cluster.local:27017/admin"

  # Kafka Configuration (internal K8s service DNS)
  KAFKA_BROKERS: "kafka-broker-1.kafka.svc.cluster.local:29092,kafka-broker-2.kafka.svc.cluster.local:29093,kafka-broker-3.kafka.svc.cluster.local:29094"
  KAFKA_CLIENT_ID: "alert-webhook-service"
  KAFKA_ALERTS_TOPIC: "alerts"

  # Enrichment Configuration
  KAFKA_ENRICHMENTS_TOPIC: "alert-enrichments"
  PROMETHEUS_URL: "http://prometheus-kube-prometheus-prometheus.default.svc:9090"

  # Service Configuration
  PORT: "8080"
  NODE_ENV: "production"
