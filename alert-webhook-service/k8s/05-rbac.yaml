apiVersion: v1
kind: ServiceAccount
metadata:
  name: alert-webhook-sa
  namespace: alerts
  labels:
    app: alert-webhook-service
    component: alerting
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alert-webhook-enricher
  labels:
    app: alert-webhook-service
rules:
  # Pod operations (describe, get, logs)
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
  # Events
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
  # Nodes (for node-level alerts)
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  # ConfigMaps and Secrets metadata (for config change detection)
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list"]
  # Services and Endpoints (for service context)
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list"]
  # PVCs (for storage alerts)
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"]
  # Deployments, ReplicaSets (for deployment change detection)
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
  # Namespaces
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alert-webhook-enricher-binding
  labels:
    app: alert-webhook-service
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alert-webhook-enricher
subjects:
  - kind: ServiceAccount
    name: alert-webhook-sa
    namespace: alerts
