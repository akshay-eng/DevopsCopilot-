global:
  resolve_timeout: 5m

inhibit_rules:
- equal:
  - namespace
  - alertname
  source_matchers:
  - severity = critical
  target_matchers:
  - severity =~ warning|info
- equal:
  - namespace
  - alertname
  source_matchers:
  - severity = warning
  target_matchers:
  - severity = info
- equal:
  - namespace
  source_matchers:
  - alertname = InfoInhibitor
  target_matchers:
  - severity = info
- target_matchers:
  - alertname = InfoInhibitor

receivers:
- name: "null"
- name: 'devopscopilot-webhook'
  webhook_configs:
    - url: 'http://alert-webhook-service.alerts.svc.cluster.local:8080/webhook/alerts'
      send_resolved: true
      http_config:
        follow_redirects: true
      max_alerts: 0

route:
  group_by:
  - namespace
  - alertname
  group_interval: 5m
  group_wait: 30s
  receiver: 'devopscopilot-webhook'  # Changed from "null" to webhook
  repeat_interval: 12h
  routes:
  - matchers:
    - alertname = "Watchdog"
    receiver: "null"
  # KubePodCrashLooping - repeat every 2 minutes
  - matchers:
    - alertname = "KubePodCrashLooping"
    receiver: 'devopscopilot-webhook'
    group_wait: 10s
    repeat_interval: 2m
  # Critical alerts - send immediately
  - matchers:
    - severity = critical
    receiver: 'devopscopilot-webhook'
    group_wait: 0s
    repeat_interval: 5m
  # Warning alerts
  - matchers:
    - severity = warning
    receiver: 'devopscopilot-webhook'
    group_wait: 30s
    repeat_interval: 30m

templates:
- /etc/alertmanager/config/*.tmpl
