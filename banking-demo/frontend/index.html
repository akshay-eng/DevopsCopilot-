<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureBank - Online Banking</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; color: #333; }

        .header { background: linear-gradient(135deg, #1a237e, #283593); color: white; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 24px; }
        .status-badge { padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; }
        .status-healthy { background: #4caf50; }
        .status-unhealthy { background: #f44336; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }

        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }

        .error-banner { background: #ffebee; border: 2px solid #f44336; border-radius: 10px; padding: 20px; margin-bottom: 20px; display: none; }
        .error-banner h3 { color: #c62828; margin-bottom: 8px; }
        .error-banner p { color: #b71c1c; font-size: 14px; }
        .error-banner .cascade { margin-top: 10px; padding: 10px; background: #fce4ec; border-radius: 6px; font-size: 13px; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .card h2 { font-size: 18px; margin-bottom: 16px; color: #1a237e; border-bottom: 2px solid #e8eaf6; padding-bottom: 10px; }
        .card.full-width { grid-column: 1 / -1; }

        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #eee; font-size: 14px; }
        th { font-weight: 600; color: #666; font-size: 12px; text-transform: uppercase; }
        .balance { font-weight: 700; color: #2e7d32; }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 4px; }
        .form-group select, .form-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        .btn { background: #1a237e; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; width: 100%; }
        .btn:hover { background: #283593; }
        .btn:disabled { background: #999; cursor: not-allowed; }

        .txn-type { padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
        .txn-transfer { background: #e3f2fd; color: #1565c0; }
        .txn-deposit { background: #e8f5e9; color: #2e7d32; }
        .txn-withdrawal { background: #fff3e0; color: #e65100; }

        .msg { padding: 10px; border-radius: 6px; margin-top: 10px; font-size: 13px; }
        .msg-success { background: #e8f5e9; color: #2e7d32; }
        .msg-error { background: #ffebee; color: #c62828; }

        .loading { text-align: center; padding: 20px; color: #999; }
    </style>
</head>
<body>
    <div class="header">
        <h1>SecureBank</h1>
        <span id="statusBadge" class="status-badge status-healthy">System Healthy</span>
    </div>

    <div class="container">
        <div id="errorBanner" class="error-banner">
            <h3>Service Disruption Detected</h3>
            <p id="errorMsg">Unable to connect to banking services.</p>
            <div class="cascade">
                <strong>Cascade Failure:</strong>
                <span id="cascadeMsg">Database OOM -> Backend 503 -> Frontend data unavailable</span>
            </div>
        </div>

        <div class="grid">
            <div class="card">
                <h2>Accounts</h2>
                <div id="accountsTable"><div class="loading">Loading accounts...</div></div>
            </div>

            <div class="card">
                <h2>Transfer Funds</h2>
                <form id="transferForm">
                    <div class="form-group">
                        <label>From Account</label>
                        <select id="fromAccount"><option>Loading...</option></select>
                    </div>
                    <div class="form-group">
                        <label>To Account</label>
                        <select id="toAccount"><option>Loading...</option></select>
                    </div>
                    <div class="form-group">
                        <label>Amount ($)</label>
                        <input type="number" id="amount" min="0.01" step="0.01" placeholder="0.00" required>
                    </div>
                    <button type="submit" class="btn" id="transferBtn">Transfer</button>
                    <div id="transferMsg"></div>
                </form>
            </div>

            <div class="card full-width">
                <h2>Recent Transactions</h2>
                <div id="txnTable"><div class="loading">Loading transactions...</div></div>
            </div>
        </div>
    </div>

    <script>
        const API = window.location.protocol + '//' + window.location.hostname + ':30500';
        let systemHealthy = true;

        async function checkHealth() {
            try {
                const res = await fetch(`${API}/health`, { signal: AbortSignal.timeout(3000) });
                const data = await res.json();
                if (res.ok && data.status === 'healthy') {
                    setHealthy();
                } else {
                    setUnhealthy(data.error || 'Backend reports unhealthy');
                }
            } catch (e) {
                setUnhealthy('Backend unreachable - connection refused');
            }
        }

        function setHealthy() {
            systemHealthy = true;
            document.getElementById('statusBadge').className = 'status-badge status-healthy';
            document.getElementById('statusBadge').textContent = 'System Healthy';
            document.getElementById('errorBanner').style.display = 'none';
            document.getElementById('transferBtn').disabled = false;
        }

        function setUnhealthy(error) {
            systemHealthy = false;
            document.getElementById('statusBadge').className = 'status-badge status-unhealthy';
            document.getElementById('statusBadge').textContent = 'System Down';
            document.getElementById('errorBanner').style.display = 'block';
            document.getElementById('errorMsg').textContent = error;
            document.getElementById('transferBtn').disabled = true;
        }

        async function loadAccounts() {
            try {
                const res = await fetch(`${API}/api/accounts`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                if (data.error) throw new Error(data.error);

                const accts = data.accounts;
                let html = '<table><tr><th>ID</th><th>Name</th><th>Balance</th></tr>';
                accts.forEach(a => {
                    html += `<tr><td>${a.id}</td><td>${a.name}</td><td class="balance">$${a.balance.toFixed(2)}</td></tr>`;
                });
                html += '</table>';
                document.getElementById('accountsTable').innerHTML = html;

                ['fromAccount', 'toAccount'].forEach(sel => {
                    const el = document.getElementById(sel);
                    el.innerHTML = accts.map(a => `<option value="${a.id}">${a.name} ($${a.balance.toFixed(2)})</option>`).join('');
                });
            } catch (e) {
                document.getElementById('accountsTable').innerHTML = `<div class="msg msg-error">Failed to load accounts: ${e.message}</div>`;
            }
        }

        async function loadTransactions() {
            try {
                const res = await fetch(`${API}/api/transactions`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                if (data.error) throw new Error(data.error);

                const txns = data.transactions;
                if (!txns.length) {
                    document.getElementById('txnTable').innerHTML = '<p style="color:#999;text-align:center">No transactions yet</p>';
                    return;
                }

                let html = '<table><tr><th>Type</th><th>From</th><th>To</th><th>Amount</th><th>Date</th></tr>';
                txns.forEach(t => {
                    const cls = `txn-${t.type}`;
                    html += `<tr>
                        <td><span class="txn-type ${cls}">${t.type}</span></td>
                        <td>${t.from_name}</td><td>${t.to_name}</td>
                        <td class="balance">$${t.amount.toFixed(2)}</td>
                        <td>${new Date(t.created_at).toLocaleString()}</td>
                    </tr>`;
                });
                html += '</table>';
                document.getElementById('txnTable').innerHTML = html;
            } catch (e) {
                document.getElementById('txnTable').innerHTML = `<div class="msg msg-error">Failed to load transactions: ${e.message}</div>`;
            }
        }

        document.getElementById('transferForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgEl = document.getElementById('transferMsg');
            try {
                const res = await fetch(`${API}/api/transfer`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        from_account_id: parseInt(document.getElementById('fromAccount').value),
                        to_account_id: parseInt(document.getElementById('toAccount').value),
                        amount: parseFloat(document.getElementById('amount').value)
                    })
                });
                const data = await res.json();
                if (res.ok) {
                    msgEl.innerHTML = `<div class="msg msg-success">${data.message}</div>`;
                    loadAccounts();
                    loadTransactions();
                } else {
                    msgEl.innerHTML = `<div class="msg msg-error">${data.error}</div>`;
                }
            } catch (e) {
                msgEl.innerHTML = `<div class="msg msg-error">Service unavailable: ${e.message}</div>`;
            }
        });

        // Initial load & polling
        checkHealth();
        loadAccounts();
        loadTransactions();
        setInterval(checkHealth, 5000);
        setInterval(() => { if (systemHealthy) { loadAccounts(); loadTransactions(); } }, 10000);
    </script>
</body>
</html>
