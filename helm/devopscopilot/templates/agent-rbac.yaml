apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "devopscopilot.agent.serviceAccountName" . }}
  labels:
    {{- include "devopscopilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: cluster-agent
rules:
  # Read-only access to the resources the agent watches.
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - endpoints
      - persistentvolumeclaims
      - events
      - configmaps
      - secrets
      - nodes
      - namespaces
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "devopscopilot.agent.serviceAccountName" . }}
  labels:
    {{- include "devopscopilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: cluster-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "devopscopilot.agent.serviceAccountName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "devopscopilot.agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
