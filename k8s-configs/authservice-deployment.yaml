---
apiVersion: v1
kind: Service
metadata:
  name: authservice
  namespace: default
spec:
  selector:
    app: authservice
  ports:
    - name: http
      port: 5001
      targetPort: 5001
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authservice
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authservice
  template:
    metadata:
      labels:
        app: authservice
    spec:
      containers:
        - name: authservice
          image: node:20-alpine  # You'll need to build a proper image
          workingDir: /app
          command: ["npm", "start"]
          ports:
            - containerPort: 5001
          env:
            - name: PORT
              value: "5001"
            - name: NODE_ENV
              value: "production"
            - name: MONGO_DB_URI
              value: "mongodb://192.168.1.105:27017/devopscopilot"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-0.kafka-headless.kafka.svc.cluster.local:9092"
            - name: PROMETHEUS_URL
              value: "http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: authservice-secrets
                  key: jwt-secret
          volumeMounts:
            - name: app-code
              mountPath: /app
      volumes:
        - name: app-code
          # You'll need to create a proper Docker image or use a ConfigMap
          # For now, this is a placeholder
          emptyDir: {}
