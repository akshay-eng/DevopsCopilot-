apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-rest-proxy
  namespace: kafka
  labels:
    app: kafka-rest-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-rest-proxy
  template:
    metadata:
      labels:
        app: kafka-rest-proxy
    spec:
      hostname: rest-proxy
      containers:
      - name: rest-proxy
        image: confluentinc/cp-kafka-rest:7.3.0
        ports:
        - containerPort: 8082
        env:
        - name: KAFKA_REST_HOST_NAME
          value: "rest-proxy"
        - name: KAFKA_REST_BOOTSTRAP_SERVERS
          value: "kafka-broker-1:29092,kafka-broker-2:29093,kafka-broker-3:29094"
        - name: KAFKA_REST_LISTENERS
          value: "http://0.0.0.0:8082"
        - name: KAFKA_REST_SCHEMA_REGISTRY_URL
          value: "http://schema-registry:8081"
        livenessProbe:
          httpGet:
            path: /
            port: 8082
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8082
          initialDelaySeconds: 20
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-rest-proxy
  namespace: kafka
spec:
  ports:
  - name: http
    port: 8082
    targetPort: 8082
  selector:
    app: kafka-rest-proxy
  type: ClusterIP