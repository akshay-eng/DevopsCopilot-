<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>AIOps Platform - Enterprise Observability & Monitoring</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // ── Design tokens ──────────────────────────────────────────────
      // Enterprise dark aesthetic: near-black neutral surfaces + a single
      // lime-green accent (replaces the old purple). Remapping violet/purple/
      // indigo -> lime recolours every accent utility class app-wide at once;
      // slate -> zinc removes the blue tint from all neutral text/borders.
      // Robusta look: neutral black/white base + a restrained BLUE accent (links,
      // active states). Remapping violet/purple/indigo -> blue recolours every accent
      // utility class app-wide; slate -> zinc keeps the neutral (no blue-tinted) greys.
      var blue = {50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a',950:'#172554'};
      var zinc = {50:'#fafafa',100:'#f4f4f5',200:'#e4e4e7',300:'#d4d4d8',400:'#a1a1aa',500:'#71717a',600:'#52525b',700:'#3f3f46',800:'#27272a',900:'#18181b',950:'#09090b'};
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#2563eb',   // blue-600 — links / active / text accent
              secondary: '#3b82f6', // blue-500 — buttons
              accent: '#60a5fa',    // blue-400
              dark: '#0a0a0a',
              darker: '#000000',
              brand: blue,
              violet: blue, purple: blue, indigo: blue,
              slate: zinc,
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* Neutralise legacy blue-tinted dark surfaces -> reference near-black.
         Only applied where these exact arbitrary values are used (dark theme). */
      .bg-\[\#0a0a0f\]{background-color:#0a0a0a!important}
      .bg-\[\#13131f\]{background-color:#141414!important}
      .bg-\[\#0d0d18\]{background-color:#111111!important}
      .bg-\[\#1c1c2e\]{background-color:#18181b!important}
      /* Refined, subtle scrollbars for the enterprise feel */
      ::-webkit-scrollbar{width:10px;height:10px}
      ::-webkit-scrollbar-track{background:transparent}
      ::-webkit-scrollbar-thumb{background:#3f3f46;border-radius:8px;border:2px solid transparent;background-clip:content-box}
      ::-webkit-scrollbar-thumb:hover{background:#52525b;border:2px solid transparent;background-clip:content-box}
      * { scrollbar-color: #3f3f46 transparent; }
      /* Fully hidden scrollbar (sidebar nav) — still scrollable */
      .no-scrollbar::-webkit-scrollbar{width:0;height:0;display:none}
      .no-scrollbar{scrollbar-width:none;-ms-overflow-style:none}
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    -->
  </body>
</html>
