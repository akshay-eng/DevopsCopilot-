apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    # Inhibition rules (keep existing ones)
    inhibit_rules:
      - equal:
          - namespace
          - alertname
        source_matchers:
          - severity = critical
        target_matchers:
          - severity =~ warning|info
      - equal:
          - namespace
          - alertname
        source_matchers:
          - severity = warning
        target_matchers:
          - severity = info
      - equal:
          - namespace
        source_matchers:
          - alertname = InfoInhibitor
        target_matchers:
          - severity = info
      - target_matchers:
          - alertname = InfoInhibitor

    # Define receivers
    receivers:
      - name: "null"
      - name: 'devopscopilot-webhook'
        webhook_configs:
          # Point to your LOCAL cluster-agent running on your machine (192.168.1.105)
          - url: 'http://192.168.1.105:8080/webhook/alerts'
            send_resolved: true
            http_config:
              follow_redirects: true
            max_alerts: 0  # Send all alerts, no limit

    # Route configuration
    route:
      group_by:
        - namespace
        - alertname
      group_interval: 5m
      group_wait: 10s
      receiver: 'devopscopilot-webhook'  # Default receiver for all alerts
      repeat_interval: 12h
      routes:
        # Keep Watchdog quiet
        - matchers:
            - alertname = "Watchdog"
          receiver: "null"
        # KubePodCrashLooping - repeat every 2 minutes
        - matchers:
            - alertname = "KubePodCrashLooping"
          receiver: 'devopscopilot-webhook'
          group_wait: 10s
          repeat_interval: 2m  # Repeat every 2 minutes until resolved
        # Critical alerts - send immediately
        - matchers:
            - severity = critical
          receiver: 'devopscopilot-webhook'
          group_wait: 0s
          repeat_interval: 5m
        # Warning alerts
        - matchers:
            - severity = warning
          receiver: 'devopscopilot-webhook'
          group_wait: 30s
          repeat_interval: 30m

    templates:
      - /etc/alertmanager/config/*.tmpl
